# Two independently-versioned packages. redactify-core is deliberately NOT
# a package: nothing depends on it by version (both consumers reference it
# as `{ path = ... }`), so its version number is decorative. Instead, both
# real packages subscribe to the `core` scope, so a change to the engine
# ships to users through both the app and the CLI — which is what actually
# happens.
#
# Scope attribution is viable here because every feat/fix commit in this
# repo's history is already scoped: app (22), core (9), cli (4), with zero
# unscoped feat/fix commits.

[packages.redactify-app]
versioned_files = [
  "app/src-tauri/Cargo.toml",
  "app/package.json",
]
changelog = "app/CHANGELOG.md"
scopes = ["app", "core"]

[packages.redactify-cli]
versioned_files = ["crates/redactify-cli/Cargo.toml"]
changelog = "crates/redactify-cli/CHANGELOG.md"
scopes = ["cli", "core"]

# ---------------------------------------------------------------------------
# prepare-release: run on every push to main, keeps one open release PR
# ---------------------------------------------------------------------------
# Branch is `chore/release`, NOT the recipe's bare `release` — the repo's
# branch-name-check workflow requires `type/slug` and would reject a
# slashless branch name outright.
#
# The title/body templates deliberately contain no $version or $changelog
# variables: Knope's own docs state those don't work with multiple
# packages. The PR diff shows both versions and both changelogs anyway.

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c chore/release"

[[workflows.steps]]
type = "PrepareRelease"

# Roll both per-package changelogs up into the root CHANGELOG.md. Runs
# after PrepareRelease (which writes those per-package files) and before
# the commit, so the aggregated file lands in the same release PR and is
# reviewable alongside everything else. The explicit `git add` is needed
# because PrepareRelease only stages the files IT touched — the root
# changelog isn't one of them.
[[workflows.steps]]
type = "Command"
command = "node .github/scripts/aggregate-changelog.js"

[[workflows.steps]]
type = "Command"
command = "git add CHANGELOG.md"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin chore/release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release"

[workflows.steps.body]
template = "Opened automatically by Knope. Merging this creates a release for every package that has changes.\n\nCheck the diff for the new version numbers and changelog entries."

# ---------------------------------------------------------------------------
# release: run when the release PR merges
# ---------------------------------------------------------------------------

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "garykellygrimm-a11y"
repo = "Redactify"
