[package]
versioned_files = [
  "Cargo.toml",
  "app/package.json",
  { path = "Cargo.lock", dependency = "redactify-app" },
  { path = "Cargo.lock", dependency = "redactify-cli" },
  { path = "Cargo.lock", dependency = "redactify-core" },
  "app/package-lock.json",
]
changelog = "CHANGELOG.md"
scopes = ["app", "cli", "core"]
assets = "artifacts/*"

# ---------------------------------------------------------------------------
# prepare-release: run on every push to main, keeps one open release PR
# ---------------------------------------------------------------------------

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C chore/release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin chore/release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: release $version"

[workflows.steps.body]
template = "Opened automatically by Knope. Merging this releases $version.\n\n$changelog"

# ---------------------------------------------------------------------------
# document-change: create a changeset by hand
# ---------------------------------------------------------------------------

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

# ---------------------------------------------------------------------------
# release: run when the release PR merges
# ---------------------------------------------------------------------------

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "garykellygrimm-a11y"
repo = "Redactify"


