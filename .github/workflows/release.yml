name: Release

on:
  push:
    tags: ["v*"]

jobs:
  app:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm install
        working-directory: app

      - name: Build and attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Redactify ${{ github.ref_name }}"
          releaseBody: "Installers are unsigned — verify the SHA-256 checksums attached to this release against your download."
          releaseDraft: true
          args: ${{ matrix.args }}

  cli:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: redactify-cli.exe
            archive: redactify-cli-windows-x64.zip
            # Fully static CRT: the binary runs on a bare Windows box
            # with zero dependencies — the air-gap story, delivered.
            rustflags: "-C target-feature=+crt-static"
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: redactify-cli
            archive: redactify-cli-macos-arm64.tar.gz
            rustflags: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: redactify-cli
            archive: redactify-cli-linux-x64.tar.gz
            rustflags: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p redactify-cli --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"
          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
