# Example custom detection rules for Redactify.
#
#   redactify-cli scan tests/fixtures/custom-sample.log --rules examples/custom-rules.toml
#
# A rule whose id matches a builtin REPLACES that builtin; the builtin ids
# are listed in docs/reference/detection-rules.md. Patterns use Rust regex
# syntax: no lookahead/lookbehind; anchor with \b word boundaries.

[[rules]]
id = "cui_marker"
name = "CUI Banner Marking"
# (?i) makes the match case-insensitive.
pattern = '(?i)\bCUI//[A-Z]+\b'

[[rules]]
id = "internal_host"
name = "Internal Hostname"
pattern = '\b[a-z]{2,4}-(?:app|db|web)-\d{2}\.corp\.example\b'
