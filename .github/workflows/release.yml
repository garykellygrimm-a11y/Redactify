name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does the current version still need releasing?
        id: check
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ -z "$VERSION" ]; then
            echo "could not read a version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already tagged — nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## ${VERSION} " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${VERSION} — waiting for a release PR."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} has no tag and a changelog section — releasing."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "-- --locked"
          - platform: macos-latest
            args: "--target universal-apple-darwin -- --locked"
          - platform: ubuntu-22.04
            args: "-- --locked"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add the macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find target -path '*/release/bundle/*' \
            \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} staging/ \;
          ls -la staging
          # Fail loudly rather than ship an empty release.
          [ -n "$(ls -A staging)" ] || { echo "no installers found to stage" >&2; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.platform }}
          path: staging/*
          if-no-files-found: error

  build-cli:
    needs: check
    if: needs.check.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: redactify-cli.exe
            archive: redactify-cli-windows-x64.zip
            rustflags: "-C target-feature=+crt-static"
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: redactify-cli
            archive: redactify-cli-macos-arm64.tar.gz
            rustflags: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: redactify-cli
            archive: redactify-cli-linux-x64.tar.gz
            rustflags: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add the build target
        run: rustup target add ${{ matrix.target }}

      - name: Build CLI
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p redactify-cli --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -DestinationPath "${{ matrix.archive }}"
          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    needs: [check, build-app, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what will be uploaded
        run: ls -la artifacts

      - name: Install Knope
        env:
          KNOPE_VERSION: "0.23.0"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSL -o "$workdir/knope.tgz" \
            "https://github.com/knope-dev/knope/releases/download/knope/v${KNOPE_VERSION}/knope-x86_64-unknown-linux-musl.tgz"
          tar -xzf "$workdir/knope.tgz" -C "$workdir"
          bin="$(find "$workdir" -type f -name knope | head -1)"
          [ -n "$bin" ] || { echo "knope binary not found in archive" >&2; exit 1; }
          chmod +x "$bin"
          sudo mv "$bin" /usr/local/bin/knope
          rm -rf "$workdir"
          knope --version

      - name: Create the releases and upload assets
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
