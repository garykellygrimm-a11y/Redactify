name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-audit
      - name: Scan dependencies against the RustSec advisory database
        run: cargo audit --deny warnings
