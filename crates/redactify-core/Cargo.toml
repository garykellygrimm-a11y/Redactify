[package]
name = "redactify-core"
version.workspace = true
edition = "2024"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
chrono = "0.4"
toml = "1.1"
base64 = "0.23"
bs58 = "0.5"
toml_edit = "0.25"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
