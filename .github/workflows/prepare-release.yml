name: Prepare Release

# Runs on every push to main and keeps a single open release PR
# (`chore/release`) current: bumped versions, per-package changelogs, and
# the aggregated root CHANGELOG.md. Merging that PR is what triggers
# release.yml.
#
# The `if` guard is load-bearing: when the release PR itself merges, the
# squashed commit message is "chore: prepare release". Without the guard
# this workflow would immediately re-run on its own merge and try to
# prepare a release of the release.

on:
  push:
    branches: [main]

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history AND tags. Knope reads the last package version tag
          # (redactify-app/v0.5.0, redactify-cli/v0.5.0) to decide where to
          # start counting commits — a shallow clone would make it think
          # nothing has ever been released.
          fetch-depth: 0
          # PAT rather than GITHUB_TOKEN: a branch pushed with GITHUB_TOKEN
          # doesn't trigger workflows, so ci.yml/audit.yml/codeql.yml would
          # never report on the release PR and required checks would block
          # the merge forever.
          #
          # Needs Contents, Pull requests, and Workflows all set to
          # read/write. If the secret name is wrong or missing, the
          # reference resolves to an empty string, which overrides
          # checkout's default token and fails with the confusing
          # "Input required and not supplied: token".
          #
          # The name predates both release-plz and release-please; it's kept
          # as-is because GitHub won't reveal an existing secret's value, so
          # renaming means regenerating a working PAT for no functional gain.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Installed by direct download rather than knope-dev/action@v2.1.0.
      # That action resolves the release asset with a "*linux*" style glob,
      # which now matches BOTH knope-aarch64-unknown-linux-musl.tgz and
      # knope-x86_64-unknown-linux-musl.tgz — it then hands both names to
      # tar as one filename and dies. Knope's own manual install docs have
      # the same flaw. Naming the exact asset sidesteps it, and the version
      # stays pinned in one obvious place.
      #
      # Note the "knope/" segment in the URL: Knope's own repo is a
      # monorepo and tags its releases knope/v0.22.4, not v0.22.4 — the
      # same tagging scheme this repo is adopting. Verified: the URL below
      # resolves, extracts to knope-x86_64-unknown-linux-musl/knope, and
      # reports "knope 0.22.4".
      #
      # Extracted under /tmp so the archive and its contents never land in
      # the checkout.
      - name: Install Knope
        env:
          KNOPE_VERSION: "0.22.4"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSL -o "$workdir/knope.tgz" \
            "https://github.com/knope-dev/knope/releases/download/knope/v${KNOPE_VERSION}/knope-x86_64-unknown-linux-musl.tgz"
          tar -xzf "$workdir/knope.tgz" -C "$workdir"
          bin="$(find "$workdir" -type f -name knope | head -1)"
          [ -n "$bin" ] || { echo "knope binary not found in archive" >&2; exit 1; }
          chmod +x "$bin"
          sudo mv "$bin" /usr/local/bin/knope
          rm -rf "$workdir"
          knope --version

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare the release PR
        run: knope prepare-release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
