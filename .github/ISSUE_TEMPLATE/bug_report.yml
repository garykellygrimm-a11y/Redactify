name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this might be a
        **security vulnerability**, please use private reporting instead —
        see [SECURITY.md](https://github.com/garykellygrimm-a11y/Redactify/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Redactify version
      description: For the desktop app, press `?` and read the version at the bottom of the shortcuts panel (versions after 0.6.2), or use the version in the installer's file name. For the CLI, run `redactify-cli --version`.
      placeholder: "0.6.2"
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Desktop app
        - CLI
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Please describe the shape of the input rather than pasting real
        content — e.g. "a log file with an IPv4 address followed by an
        email on the same line," not the actual file.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error text
      description: |
        CLI output, or the text of any error message shown in the app.
        Please redact anything sensitive before pasting — yes, we see the
        irony.
      render: shell
