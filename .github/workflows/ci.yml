name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all --locked

  tauri-versions:
    name: Tauri crate/npm versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Tauri crates and npm packages share major.minor
        run: python3 scripts/check-tauri-versions.py

  web:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
