name: "Security and Quality Code Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 4' # Automated scan every Thursday at 4:30 AM UTC

jobs:
  # --- LOGIC LAYER: CodeQL for Rust & TypeScript ---
  analyze-logic:
    name: CodeQL Logic Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to publish alerts to the Security tab
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # CodeQL parses both TS and Rust natively
        language: [ 'javascript-typescript', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # Enables experimental and security-extended rulesets
        queries: security-extended,security-and-quality

    # Autobuild automatically analyzes Rust modules and TS targets without custom scripts
    - name: Autobuild Engine
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  # --- MARKUP LAYER: Linters for HTML & CSS ---
  analyze-markup:
    name: Frontend Quality Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF report outputs to GitHub
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 1. Run HTML Quality Scan using built-in HTMLHint SARIF formatting
    - name: Scan HTML Layouts
      run: |
        npm install -g htmlhint
        htmlhint "**/*.html" --format sarif > htmlhint-results.sarif || true

    # 2. Run CSS Quality Scan using Stylelint
    - name: Scan CSS Stylesheets
      run: |
        npm install -g stylelint stylelint-config-standard stylelint-formatter-sarif
        echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json
        stylelint "**/*.css" --format sarif --output stylelint-results.sarif || true

    # 3. Upload frontend vulnerabilities directly to your GitHub Security Dashboard
    - name: Upload Frontend Security Findings
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: .
