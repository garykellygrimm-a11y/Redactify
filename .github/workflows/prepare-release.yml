name: Prepare Release

# Keeps a single open `chore/release` PR current with the next version
# and changelog. Merging it is what releases.

on:
  push:
    branches: [main]
  # Manual trigger with an explicit override, for redoing a bad run.
  workflow_dispatch:
    inputs:
      override_version:
        description: "Optional: force versions, e.g. redactify-app=0.6.0 (see knope prepare-release --help)"
        required: false
        type: string

jobs:
  prepare-release:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Knope reads the last version tag to decide where to start.
          fetch-depth: 0
          # PAT, not GITHUB_TOKEN — pushes with the latter don't trigger the
          # PR's required checks. Needs Contents, Pull requests, Workflows.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Direct download, not knope-dev/action — its asset glob matches both
      # the aarch64 and x86_64 tarballs and feeds both to tar. Note the
      # "knope/" path segment: their repo tags releases knope/vX.Y.Z.
      - name: Install Knope
        env:
          KNOPE_VERSION: "0.22.4"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSL -o "$workdir/knope.tgz" \
            "https://github.com/knope-dev/knope/releases/download/knope/v${KNOPE_VERSION}/knope-x86_64-unknown-linux-musl.tgz"
          tar -xzf "$workdir/knope.tgz" -C "$workdir"
          bin="$(find "$workdir" -type f -name knope | head -1)"
          [ -n "$bin" ] || { echo "knope binary not found in archive" >&2; exit 1; }
          chmod +x "$bin"
          sudo mv "$bin" /usr/local/bin/knope
          rm -rf "$workdir"
          knope --version

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare the release PR
        run: |
          # Only that one error is swallowed; anything else still fails the
          # job. Note that Knope aborts its whole workflow when
          # PrepareRelease errors, so the commit/push/PR steps never run —
          # nothing partial is left behind.
          set +e
          if [ -n "${{ inputs.override_version }}" ]; then
            output=$(knope prepare-release --verbose --override-version "${{ inputs.override_version }}" 2>&1)
          else
            output=$(knope prepare-release --verbose 2>&1)
          fi
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -q "no_release"; then
              echo "::notice::No packages have releasable changes — nothing to prepare."
              exit 0
            fi
            exit $status
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
