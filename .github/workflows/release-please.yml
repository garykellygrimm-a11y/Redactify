name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['app/src-tauri--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

  sync-versions:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read the version release-please just tagged
        id: version
        run: |
          VERSION=$(grep -m1 '^version' app/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync redactify-core, redactify-cli, and package.json to match
        run: |
          V="${{ steps.version.outputs.version }}"
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" crates/redactify-core/Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" crates/redactify-cli/Cargo.toml
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('app/package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('app/package.json', JSON.stringify(p, null, 2) + '\n');
          " "$V"

      - name: Fold the new entry into the root CHANGELOG.md
        run: |
          # release-please's local changelog always has exactly one
          # version section at this point, since this step deletes it
          # after harvesting each time (see below) — no multi-section
          # parsing needed, just "everything from the first ## [ down".
          NEW_ENTRY=$(awk '/^## \[/{f=1} f' app/src-tauri/CHANGELOG.md)
          awk -v entry="$NEW_ENTRY" '
            /^## \[/ && !done { print entry; print ""; done=1 }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
          rm app/src-tauri/CHANGELOG.md

      - name: Open a PR with the synced files
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: sync versions to v${{ steps.version.outputs.version }}"
          branch: chore/sync-version-${{ github.sha }}
          title: "chore: sync versions to v${{ steps.version.outputs.version }}"
          body: |
            Mechanical follow-up to the release-please release of
            v${{ steps.version.outputs.version }} — brings
            redactify-core, redactify-cli, and the frontend
            package.json in line with app/src-tauri, and folds the
            new changelog entry into the root CHANGELOG.md.
          labels: automated
