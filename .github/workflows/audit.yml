name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2.87.23
        with:
          tool: cargo-audit
      - name: Scan dependencies against the RustSec advisory database
        run: cargo audit --deny warnings
