name: "Security and Quality Code Scanning"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 4'

jobs:
  analyze-logic:
    name: CodeQL Logic Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Autobuild Engine
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  analyze-markup:
    name: Frontend Quality Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Scan HTML Layouts
      run: |
        npm install -g htmlhint
        htmlhint **/*.html --format sarif > htmlhint-results.sarif || true

    - name: Scan CSS Stylesheets
      run: |
        npm install -g stylelint@15 stylelint-config-standard
        echo '{"extends": "stylelint-config-standard"}' > .stylelintrc.json

        FILES=$(find . -type f -name "*.css")

        if [ -z "$FILES" ]; then
          echo "No CSS files found, creating empty SARIF"
          echo '{"version":"2.1.0","runs":[]}' > stylelint-results.sarif
        else
          stylelint $FILES --formatter sarif --output stylelint-results.sarif || true
        fi

    - name: Debug SARIF existence
      run: ls -l stylelint-results.sarif || echo "SARIF file missing"

    - name: Upload HTML Security Findings
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: htmlhint-results.sarif
        category: htmlhint

    - name: Upload CSS Security Findings
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: stylelint-results.sarif
        category: stylelint
